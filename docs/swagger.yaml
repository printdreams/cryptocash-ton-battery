basePath: /
definitions:
  handler.AdminCreditResponse:
    properties:
      available:
        type: integer
      balance:
        type: integer
      entryId:
        type: string
      idempotent:
        type: boolean
      reserved:
        type: integer
      userId:
        type: string
    type: object
  handler.BalanceResponse:
    properties:
      available:
        type: integer
      balance:
        type: integer
      reserved:
        type: integer
      userId:
        type: string
    type: object
  handler.DecisionResponse:
    properties:
      allowed:
        type: boolean
      charge:
        type: integer
      rejectReason:
        type: string
      supported:
        type: boolean
    type: object
  handler.EmulateResponse:
    properties:
      destinations:
        items:
          type: string
        type: array
      outMessages:
        type: integer
      success:
        type: boolean
      totalFeesNano:
        type: integer
    type: object
  handler.EntryDTO:
    properties:
      amount:
        type: integer
      balanceAfter:
        type: integer
      createdAt:
        type: string
      id:
        type: string
      op:
        type: string
      reason:
        type: string
      reservedAfter:
        type: integer
    type: object
  handler.ErrorResponse:
    properties:
      detail:
        type: string
      error:
        type: string
      message:
        type: string
    type: object
  handler.FirebaseStatusResponse:
    properties:
      connected:
        type: boolean
      error:
        type: string
      message:
        type: string
    type: object
  handler.HealthResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  handler.KillswitchResponse:
    properties:
      paused:
        type: boolean
    type: object
  handler.MeResponse:
    properties:
      publicKey:
        type: string
      userId:
        type: string
    type: object
  handler.MessageSentResponse:
    properties:
      charge:
        type: integer
      status:
        type: string
      txHash:
        type: string
    type: object
  handler.PayloadResponse:
    properties:
      payload:
        type: string
    type: object
  handler.PrintExecuteResponse:
    properties:
      charge:
        type: integer
      quoteId:
        type: string
      status:
        type: string
      txHash:
        type: string
    type: object
  handler.PrintQuoteResponse:
    properties:
      bufferTON:
        type: string
      charge:
        type: integer
      expiresAt:
        type: integer
      quoteId:
        type: string
    type: object
  handler.PrintStatusResponse:
    properties:
      bufferTON:
        type: string
      charge:
        type: integer
      quoteId:
        type: string
      status:
        type: string
      toAddress:
        type: string
      txHash:
        type: string
    type: object
  handler.ProductDTO:
    properties:
      charges:
        type: integer
      id:
        type: string
      price:
        type: string
    type: object
  handler.ProductsResponse:
    properties:
      products:
        items:
          $ref: '#/definitions/handler.ProductDTO'
        type: array
    type: object
  handler.ReconcileResponse:
    properties:
      accountBalance:
        type: integer
      accountReserved:
        type: integer
      computedBalance:
        type: integer
      computedReserved:
        type: integer
      consistent:
        type: boolean
      userId:
        type: string
    type: object
  handler.RelayerDevSendResponse:
    properties:
      amount:
        type: string
      explorer:
        type: string
      from:
        type: string
      to:
        type: string
      txHash:
        type: string
    type: object
  handler.RelayerStatusResponse:
    properties:
      address:
        type: string
      balanceNano:
        type: integer
      deployed:
        type: boolean
      error:
        type: string
      online:
        type: boolean
      seqno:
        type: integer
    type: object
  handler.TonProofCheckResponse:
    properties:
      address:
        type: string
      expiresAt:
        type: integer
      newUser:
        type: boolean
      publicKey:
        type: string
      token:
        type: string
      userId:
        type: string
    type: object
  handler.TransactionsResponse:
    properties:
      transactions:
        items:
          $ref: '#/definitions/handler.EntryDTO'
        type: array
      userId:
        type: string
    type: object
  handler.creditRequest:
    properties:
      amount:
        type: integer
      idempotencyKey:
        type: string
      reason:
        type: string
    type: object
  handler.emulateRequest:
    properties:
      boc:
        type: string
      ignoreSignature:
        type: boolean
    type: object
  handler.killswitchRequest:
    properties:
      paused:
        type: boolean
    type: object
  handler.printExecuteRequest:
    properties:
      quoteId:
        type: string
    type: object
  handler.printQuoteRequest:
    properties:
      toAddress:
        type: string
    type: object
  handler.sendRequest:
    properties:
      boc:
        type: string
      ignoreSignature:
        type: boolean
    type: object
  handler.walletEmulateRequest:
    properties:
      boc:
        type: string
      ignoreSignature:
        type: boolean
    type: object
  price.Quote:
    properties:
      centsPerCharge:
        type: integer
      currency:
        type: string
      fallback:
        type: boolean
      nanoPerCharge:
        type: integer
      tonPrice:
        type: number
    type: object
  tonproof.Domain:
    properties:
      length_bytes:
        type: integer
      value:
        type: string
    type: object
  tonproof.Proof:
    properties:
      domain:
        $ref: '#/definitions/tonproof.Domain'
      payload:
        type: string
      signature:
        type: string
      timestamp:
        type: integer
    type: object
  tonproof.Request:
    properties:
      address:
        type: string
      network:
        type: string
      proof:
        $ref: '#/definitions/tonproof.Proof'
      public_key:
        type: string
      wallet_state_init:
        type: string
    type: object
info:
  contact: {}
  description: Backend service for the Cryptocash Battery on the TON network.
  title: Battery implementation for TON network
  version: "1.0"
paths:
  /admin/killswitch:
    get:
      description: Returns whether the battery is paused. Requires the admin token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.KillswitchResponse'
      security:
      - AdminToken: []
      summary: Get the battery kill switch (admin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Pauses or resumes all sends and prints. Requires the admin token.
      parameters:
      - description: paused flag
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.killswitchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.KillswitchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - AdminToken: []
      summary: Set the battery kill switch (admin)
      tags:
      - admin
  /admin/users/{id}:
    get:
      description: Returns balance, reserved and available charges for a user. Requires
        the admin token.
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BalanceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - AdminToken: []
      summary: Get a user's charges balance (admin)
      tags:
      - admin
  /admin/users/{id}/credit:
    post:
      consumes:
      - application/json
      description: 'Mock top-up: adds charges to a user''s balance. Requires the admin
        token. Idempotent per idempotencyKey.'
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      - description: amount + idempotency key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.creditRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AdminCreditResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - AdminToken: []
      summary: Credit charges to a user (admin)
      tags:
      - admin
  /admin/users/{id}/reconcile:
    get:
      description: Recomputes balance and reserved from the ledger entries and compares
        to the account. Requires the admin token.
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ReconcileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - AdminToken: []
      summary: Reconcile a user's ledger (admin)
      tags:
      - admin
  /auth/me:
    get:
      description: Returns the authenticated user's id and public key
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /balance:
    get:
      description: Returns the authenticated user's balance, reserved and available
        charges
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BalanceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Charges balance
      tags:
      - charges
  /emulate:
    post:
      consumes:
      - application/json
      description: TEST ONLY — emulates a message BOC via tonapi and returns success,
        total fees and destinations. Enabled only when DEV_SIGN=true.
      parameters:
      - description: message boc
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.emulateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.EmulateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: '[TO BE DELETED] Dev-only message emulation'
      tags:
      - dev
  /firebase/status:
    get:
      description: Verifies the Firestore connection with a live round-trip and reports
        whether Firebase is reachable
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.FirebaseStatusResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.FirebaseStatusResponse'
      summary: Firebase connection status
      tags:
      - firebase
  /health:
    get:
      description: Returns OK status if the API is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Check service status
      tags:
      - system
  /message:
    post:
      consumes:
      - application/json
      description: Runs the battery decision, reserves charges, relays the user's
        signed message via the relayer and settles or releases the charges
      parameters:
      - description: message boc
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.sendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageSentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send a gasless message
      tags:
      - battery
  /price:
    get:
      description: Returns the live TON price and the resulting nano-per-charge used
        for charge computation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/price.Quote'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Current charge pricing
      tags:
      - charges
  /print/{id}:
    get:
      description: Returns the status of a print job
      parameters:
      - description: print job id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PrintStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Print job status
      tags:
      - print
  /print/execute:
    post:
      consumes:
      - application/json
      description: Reserves charges, sends the buffer to the new wallet (buffer-first),
        settles or releases on result
      parameters:
      - description: quote id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.printExecuteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PrintExecuteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Execute a printed wallet
      tags:
      - print
  /print/quote:
    post:
      consumes:
      - application/json
      description: Computes the buffer and charge cost for printing a new wallet and
        stores the quote
      parameters:
      - description: destination address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.printQuoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PrintQuoteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Quote a printed (gift) wallet
      tags:
      - print
  /products:
    get:
      description: Returns the available charge packs (mock catalog until real IAP)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ProductsResponse'
      summary: Charge packs catalog
      tags:
      - charges
  /relayer/dev-send:
    post:
      description: 'TEST ONLY — makes the relayer send TON to an address (deploys
        the relayer on first send, pays gas). Enabled only when DEV_SIGN=true. Response
        carries header X-Dev-Route: TO-BE-DELETED.'
      parameters:
      - description: destination address
        in: query
        name: to
        required: true
        type: string
      - description: amount in TON (default 0.05)
        in: query
        name: amount
        type: string
      - description: optional comment
        in: query
        name: comment
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RelayerDevSendResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: '[TO BE DELETED] Dev-only relayer send'
      tags:
      - dev
  /relayer/status:
    get:
      description: Shows the relayer wallet address and its on-chain balance and seqno
        (reads TON testnet)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RelayerStatusResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Relayer status
      tags:
      - relayer
  /ton-proof/check:
    post:
      consumes:
      - application/json
      description: Verifies a ton_proof signature for a v5R1 wallet, resolves the
        user by public key, and returns a session JWT
      parameters:
      - description: ton_proof payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tonproof.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TonProofCheckResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Verify ton_proof and issue a JWT
      tags:
      - auth
  /ton-proof/dev-sign:
    get:
      description: 'TEST ONLY — signs a ton_proof for a fixed test wallet from a payload,
        so /ton-proof/check can be exercised without a real wallet. Enabled only when
        DEV_SIGN=true. Response carries header X-Dev-Route: TO-BE-DELETED.'
      parameters:
      - description: payload from /ton-proof/payload
        in: query
        name: payload
        required: true
        type: string
      - description: app domain (default localhost)
        in: query
        name: domain
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tonproof.Request'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: '[TO BE DELETED] Dev-only ton_proof signer'
      tags:
      - dev
  /ton-proof/payload:
    get:
      description: Returns a single-use payload (nonce) that the wallet must sign
        for ton_proof login
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PayloadResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Generate ton_proof payload
      tags:
      - auth
  /transactions:
    get:
      description: Returns the authenticated user's ledger entries, newest first
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TransactionsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Charges history
      tags:
      - charges
  /wallet/emulate:
    post:
      consumes:
      - application/json
      description: Runs static checks, emulation and policy over a message BOC and
        returns Supported-By-Battery / Allowed-By-Battery / Reject-Reason plus the
        charge cost
      parameters:
      - description: message boc
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.walletEmulateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.DecisionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Emulate a message and return the battery decision
      tags:
      - battery
securityDefinitions:
  AdminToken:
    in: header
    name: X-Admin-Token
    type: apiKey
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
